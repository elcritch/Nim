# Special configuration file for the Nim project

@if nimKochBootstrap and sunos and amd64:
  @if gcc or clang:
    # Only the first bootstrap iteration uses the old compiler.
    # Remove these flags once csources includes compiler/extccomp.nim's targetOptions.
    passC: "-m64"
    passL: "-m64"
  @end
@end

hint[XDeclaredButNotUsed]:off

define:booting
define:nimcore
# Sigils' variant/threading dependencies use the full system exports.
@if nimKochBootstrap:
  define:nimPreviewSlimSystem
@end
define:nimPreviewCstringConversion
define:nimPreviewProcConversion
define:nimPreviewRangeDefault
@if nimKochBootstrap:
  define:nimPreviewNonVarDestructor
@end
define:nimPreviewCheckedClose
define:nimPreviewAsmSemSymbol
define:nimPreviewCStringComparisons
#define:nimPreviewDuplicateModuleError
# Incompatible with Nimony's compat2.nim for now
# NOTE: `-d:virtualParRi` (jump-encoded ParLe + elided ParRi) is NOT yet enabled:
# the IC writer assembles buffers by raw token splicing (`dest.add content[i]`),
# which does not seal scopes the way `addParRi` does, so sealed `(stmts)` get
# jump=0 and serialize empty. Enabling it needs writer buffer-sealing work first.

threads:on
mm:atomicArc
@if posix:
  # osproc's posix_spawn path changes the parent's cwd for workingDir.
  # IC workers must change directories only in the child process.
  define:useFork
@end

@if not nimKochBootstrap:
  path:"../dist/sigils"
  path:"../dist/sigils/deps/threading"
  path:"../dist/sigils/deps/variant"
  path:"../dist/sigils/deps/stack_strings"
@end

#import:"$projectpath/testability"

@if windows:
  cincludes: "$lib/wrappers/libffi/common"
@end

define:useStdoutAsStdmsg

@if nimHasStyleChecks:
  styleCheck:error
@end


#define:useNodeIds
#gc:markAndSweep

@if nimHasWarningObservableStores:
  warning[ObservableStores]:off
@end


@if nimHasWarningAsError:
  warningAsError[GcUnsafe2]:on
@end

@if nimHasWarnUnnamedBreak:
  warningAserror[UnnamedBreak]:on
@end

@if nimHasWarnBareExcept:
  warning[BareExcept]:on
  warningAserror[BareExcept]:on
@end


@if nimUseStrictDefs:
  experimental:strictDefs
  warningAsError[Uninit]:on
  warningAsError[ProveInit]:on
@end

@if nimHasWarnStdPrefix:
  warning[StdPrefix]:on
  warningAsError[StdPrefix]:on
@end

@if nimHasVtables and nimKochBootstrap:
  experimental:vtables
@end

@if nimHasImplicitRangeConversion:
  warning[ImplicitRangeConversion]:off
@end
